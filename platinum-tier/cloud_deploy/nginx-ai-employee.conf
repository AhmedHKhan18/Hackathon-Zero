# nginx reverse proxy for AI Employee health check endpoint
# Place in /etc/nginx/sites-available/ai-employee
# Enable: ln -s /etc/nginx/sites-available/ai-employee /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Replace with your VM IP or domain

    # Health check endpoint (for UptimeRobot, BetterStack, etc.)
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "text/plain";
    }

    location /status {
        proxy_pass http://127.0.0.1:8080/status;
        proxy_set_header Host $host;
    }

    # Root: simple status page
    location / {
        return 200 "AI Employee Cloud Agent — Online\nCheck /health for status.\n";
        add_header Content-Type text/plain;
    }

    # Block access to sensitive files
    location ~ /\.(env|git) {
        deny all;
    }
}
